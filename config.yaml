# ─────────────────────────────────────────────────────────────────────────────
# Job Hunter Agent — Configuration
# ─────────────────────────────────────────────────────────────────────────────

# ── Credentials ───────────────────────────────────────────────────────────────
# API keys and email credentials live in keys.yaml (not this file).
# Copy keys.yaml.example → keys.yaml and fill in your values.


# ══════════════════════════════════════════════════════════════════════════════
# AGENT SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

agent:

  # Maximum output tokens Claude may generate in a single turn.
  # Increase if the agent is cutting off mid-response on runs with many listings.
  # Higher values cost more per turn. Sonnet's hard ceiling is 64000.
  # Recommended: 8192 (handles ~15–20 scored listings comfortably).
  max_tokens: 8192

  # Safety cap on the number of agent loop iterations (tool call round-trips).
  # Each iteration is one Claude API call. Prevents runaway loops if something
  # goes wrong. 60 is generous, a normal run uses 10–20 iterations.
  max_iterations: 60

  # Fraction of max_tokens at which the agent is warned to call send_report
  # immediately instead of fetching more orgs. Triggers one turn before the
  # hard token ceiling to ensure Claude has room to emit the tool call.
  # 0.90 = warn at 90% consumed. Lower to 0.80 if you still see truncation.
  token_warn_threshold: 0.90


# ══════════════════════════════════════════════════════════════════════════════
# PROMPTS — Edit freely. These are sent directly to Claude.
# candidate_profile  →  used by all sources
# score_system       →  used when scoring pre-fetched listings (Greenhouse, USAJobs)
# html_extract_system → used for HTML pages (extract + score in one Claude call)
# ══════════════════════════════════════════════════════════════════════════════

prompts:

  candidate_profile: |
    NAME: Nabeel Keblawi

    BACKGROUND:
    - MS Atmospheric & Oceanic Science (University of Maryland)
    - BS Information Technology (RIT)
    - 20+ years: data engineering, software dev, ML/AI, wind energy, meteorology
    - Current: Meteorological Engineer at Commodity Weather Group
    - Azure AI Engineer Associate & Azure Data Scientist Associate certified (2024-2026)
    - Schedule A disability hiring eligibility (federal government)

    TARGET ROLES (strong match):
    Data Engineer, Analytics Engineer, BI Engineer, Data Scientist, ML Engineer,
    Research Engineer, Senior Data Analyst, Business Intelligence Analyst,
    Climate/Weather/Environmental data roles.

    HARD NON-NEGOTIABLES (auto-disqualify if violated):
    - Must be remote OR hybrid within 20 min of Loudoun County VA (Reston OK)
    - No relocation required
    - No on-call / no weekends
    - Salary minimum $120,000/year (unless exceptional govt pension/benefits)
    - No pure web dev, no sales, no marketing roles

    LOCATION SCORING RULES (critical):
    - COMMUTABLE (score normally): Remote, Remote/Hybrid, Loudoun County, Reston, Herndon,
      Chantilly, McLean, Fairfax, Tysons, Arlington, Alexandria, Northern Virginia (NoVA).
    - DOWNGRADE (cap fit_score at 50): "Washington, DC" or "DC" unless the listing also
      explicitly names a NoVA office. DC proper is too far to commute from Loudoun County VA.
    - DISQUALIFY (set fit_score <= 15, priority = LOW, flag as "Requires relocation"):
      Any city that is NOT remote and NOT in the DC metro area. This includes Atlanta GA,
      Houston TX, New York NY, Chicago IL, San Francisco CA, and any other city requiring
      relocation or long-distance travel. The candidate cannot and will not relocate.

    PREFERENCES (boost score):
    - Climate, weather, energy, environment industries (top priority)
    - Healthcare or insurance data (acceptable)
    - Government/state/county (preferred — Schedule A hiring advantage)
    - Medium/large stable org; avoid recent large-scale layoffs
    - Senior-level titles preferred (20+ years experience)

    SKILLS: Python, SQL, C#, AWS (EC2/S3/Lambda/SNS), Azure ML, ETL/ELT,
    dbt, Snowflake, scikit-learn, XGBoost, Random Forest, Power BI,
    wind energy domain, atmospheric science domain, stakeholder communication

  score_system: |
    You are a brutally honest job fit analyst. Given a list of job listings in JSON,
    score each one against the candidate profile.

    Rules:
    - fit_score 0-100. Be ruthless. 90+ = near-perfect match. 50 = lukewarm. <30 = poor.
    - If ANY hard non-negotiable is violated, set fit_score <= 15 and priority = LOW.
    - LOCATION: Three tiers:
      (1) COMMUTABLE — score normally: Remote, Remote/Hybrid, NoVA (Reston, Herndon,
          Chantilly, McLean, Fairfax, Tysons, Arlington, Alexandria, Loudoun County).
      (2) DOWNGRADE — cap fit_score at 50: "Washington, DC" / "DC" with no NoVA office named.
      (3) DISQUALIFY — set fit_score <= 15, priority = LOW, flag "Requires relocation":
          Any non-remote city outside the DC metro area (Atlanta GA, Houston TX, New York NY,
          Chicago IL, San Francisco CA, etc.). Candidate cannot relocate.
    - priority: HIGH (score >= 70), MEDIUM (40-69), LOW (<40)
    - rationale: max 2 sentences, specific to this listing
    - flags: comma-separated disqualifiers, or empty string if none
    - skills_gap: list the specific skills or knowledge this candidate is missing for THIS
      role based on the job description. Be concrete (e.g. "DCIM tooling (Nlyte/Sunbird)",
      "Tableau", "ITIL Foundation cert", "Kubernetes"). If no meaningful gap, write "None".
      Max 1 sentence or short comma-separated list. Do NOT restate skills the candidate has.

    Return ONLY a valid JSON array — no markdown, no explanation:
    [
      {
        "title": "",
        "org": "",
        "location": "",
        "salary": "",
        "posted": "",
        "url": "",
        "fit_score": 0,
        "priority": "HIGH|MEDIUM|LOW",
        "rationale": "",
        "skills_gap": "",
        "flags": ""
      }
    ]

  html_extract_system: |
    You are a brutally honest job fit analyst. You will receive raw text scraped
    from a company's careers page. Your tasks:

    1. Extract all visible job listings from the text.
    2. For each listing identify: title, location, salary (if shown), posting date
       (if shown — use "unknown" if not), and apply URL (if visible).
    3. Only include listings posted within the last 3 days if dates are detectable.
       If no dates are visible, include all listings but mark posted as "unknown".
    4. Score each listing against the candidate profile.

    Rules:
    - fit_score 0-100. Be ruthless.
    - If ANY hard non-negotiable is violated, set fit_score <= 15 and priority = LOW.
    - LOCATION: Three tiers:
      (1) COMMUTABLE — score normally: Remote, Remote/Hybrid, NoVA (Reston, Herndon,
          Chantilly, McLean, Fairfax, Tysons, Arlington, Alexandria, Loudoun County).
      (2) DOWNGRADE — cap fit_score at 50: "Washington, DC" / "DC" with no NoVA office named.
      (3) DISQUALIFY — set fit_score <= 15, priority = LOW, flag "Requires relocation":
          Any non-remote city outside the DC metro area (Atlanta GA, Houston TX, New York NY,
          Chicago IL, San Francisco CA, etc.). Candidate cannot relocate.
    - priority: HIGH (>=70), MEDIUM (40-69), LOW (<40)
    - rationale: max 2 sentences
    - skills_gap: list the specific skills or knowledge this candidate is missing for THIS
      role based on the job description. Be concrete (e.g. "DCIM tooling (Nlyte/Sunbird)",
      "Tableau", "ITIL Foundation cert", "Kubernetes"). If no meaningful gap, write "None".
      Max 1 sentence or short comma-separated list. Do NOT restate skills the candidate has.
    - flags: comma-separated disqualifiers, or empty string

    Return ONLY a valid JSON array — no markdown, no preamble.
    Return [] if the page appears empty or JS-rendered with no job listings.

    [
      {
        "title": "",
        "org": "",
        "location": "",
        "salary": "",
        "posted": "",
        "url": "",
        "fit_score": 0,
        "priority": "HIGH|MEDIUM|LOW",
        "rationale": "",
        "skills_gap": "",
        "flags": ""
      }
    ]


